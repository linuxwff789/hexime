name: Build Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'benchmark/**'
      - 'scripts/**'
      - '.github/workflows/build-benchmark.yml'
    tags:
      - 'bench-*'
  pull_request:
    paths:
      - 'benchmark/**'
      - 'scripts/**'
      - '.github/workflows/build-benchmark.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK / NDK / CMake
        run: |
          # runner 已预装 cmdline-tools，但未加入 PATH，这里手动定位
          CMDLINE=$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin 2>/dev/null | sort -V | tail -1)
          export PATH="$CMDLINE:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          which sdkmanager
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.13004108" "cmake;3.31.6"

      - name: Prepare librime native sources
        run: bash scripts/prepare-native.sh

      - name: Stage RIME data
        run: bash scripts/stage-rime-data.sh

      - name: Cache Boost
        uses: actions/cache@v4
        with:
          path: |
            benchmark/app/src/main/cpp/boost
            benchmark/app/src/main/cpp/boost-1.89.0.tar.xz
          key: boost-1.89.0-cmake

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        working-directory: benchmark
        run: gradle :app:assembleRelease --no-daemon --stacktrace --max-workers="$(nproc)"

      - name: Show CMake diagnostics
        if: always()
        working-directory: benchmark
        run: |
          find app/.cxx -name hexime_diag.txt -exec sh -c 'echo "=== $1 ==="; cat "$1"' _ {} \; || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hexime-benchmark-apk
          path: benchmark/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: benchmark/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
