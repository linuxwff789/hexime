name: Build IME

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK / NDK / CMake
        run: |
          CMDLINE=$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin 2>/dev/null | sort -V | tail -1)
          export PATH="$CMDLINE:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          which sdkmanager
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.13004108" "cmake;3.31.6"

      - name: Prepare librime native sources
        run: bash scripts/prepare-native.sh ime/src/main/cpp

      - name: Stage RIME data
        run: bash scripts/stage-rime-data.sh ime/src/main/assets/rime

      - name: Cache Boost
        uses: actions/cache@v4
        with:
          path: |
            ime/src/main/cpp/boost
            ime/src/main/cpp/boost-1.89.0.tar.xz
          key: boost-1.89.0-cmake

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK（用固定签名 keystore）
        working-directory: ime
        env:
          HEXIME_KEYSTORE_B64: ${{ secrets.HEXIME_KEYSTORE_B64 }}
          HEXIME_KEYSTORE_PASSWORD: ${{ secrets.HEXIME_KEYSTORE_PASSWORD }}
          HEXIME_KEY_ALIAS: ${{ secrets.HEXIME_KEY_ALIAS }}
          HEXIME_KEY_PASSWORD: ${{ secrets.HEXIME_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace --max-workers="$(nproc)"

      - name: 打印签名指纹（确认不是 debug key）
        working-directory: ime
        run: |
          APK=$(ls build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --print-certs "$APK" \
            | grep -i "certificate DN\|SHA-256 digest" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hexime-ime-apk
          path: ime/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # main 每次编译完发一个滚动 Release；推 v1.0 这种 tag 则发对应版本号
      # （签名固定 → 手机上可以直接 pm install -r 覆盖升级）
      - name: Publish to Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('ime-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('hexime {0}', github.ref_name) || format('hexime ime-{0} · {1}', github.run_number, github.sha) }}
          body: |
            自动构建 · commit `${{ github.sha }}` · run #${{ github.run_number }}

            安装（签名已固定，可直接覆盖升级，不会丢词表/设置）：

            ```
            pm install -r hexime-ime.apk
            ```
            或者 `adb install -r hexime-ime.apk`。
          files: ime/build/outputs/apk/release/*.apk
          generate_release_notes: false
          # 显式声明：一定要发成「已发布」，不能留成 draft
          # （之前查过一次：tag 都建出来了、Release 对象却是空的，公开下载全 404）
          draft: false
          prerelease: false
          make_latest: true
